name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  paper-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B package

  fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [AntiCrack, ChunkGuard, Moderation, Restore, riptide-anywhere]
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ matrix.mod }}
      - run: chmod +x gradlew
      - run: ./gradlew build --console=plain
